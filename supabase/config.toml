# Edge Functions: callbacks y webhooks externos no envían JWT de Supabase.
# Deploy: npx supabase functions deploy <nombre> --project-ref nfjjkvjsssgxxsuocmhj

[functions.mercadopago-oauth-callback]
verify_jwt = false

[functions.stripe-connect-callback]
verify_jwt = false

[functions.mercadopago-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.ingest-rum-anon]
verify_jwt = false

[functions.observability-alerts]
verify_jwt = false

[functions.auth-send-email]
verify_jwt = false

# trial-emails / app-emails: bienvenidas + recordatorios trial (Resend)
# auth-send-email: hook Send Email de Supabase Auth (confirmación + recovery)
# Deploy:
#   npx supabase functions deploy app-emails trial-emails auth-send-email --project-ref nfjjkvjsssgxxsuocmhj
# Secrets: RESEND_API_KEY, SEND_EMAIL_HOOK_SECRET (hook auth),
#   FITENGINE_EMAIL_FROM, FITENGINE_SALES_EMAIL, FITENGINE_SUPPORT_EMAIL (opcional)
