# Superadmin: mismo login global que cliente/staff (email + password) → hub plataforma.
# Requiere MAESTRO_ADMIN_EMAIL y MAESTRO_ADMIN_PASSWORD
appId: com.waitomofitengine.cueva
---
- runFlow: wait-welcome.yaml
- tapOn:
    id: welcome-cta-login-client
- assertVisible:
    id: login-email-input
- tapOn:
    id: login-email-input
- eraseText
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: login-password-input
- eraseText
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: superadmin-hub-root
    timeout: 120000
