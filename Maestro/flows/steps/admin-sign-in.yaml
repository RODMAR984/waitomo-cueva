# Superadmin: deep link waitomo://admin → login → panel. Requiere MAESTRO_ADMIN_EMAIL y MAESTRO_ADMIN_PASSWORD
appId: com.waitomofitengine.cueva
---
- runFlow: steps/wait-welcome.yaml
- openLink: waitomo://admin
- assertVisible:
    id: admin-login-email-input
- tapOn:
    id: admin-login-email-input
- eraseText
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: admin-login-password-input
- eraseText
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: admin-login-submit
- extendedWaitUntil:
    visible:
      id: admin-dashboard-root
    timeout: 120000
