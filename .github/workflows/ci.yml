name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-web-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (núcleo routing/observabilidad)
        run: npm run lint:ci

      - name: QA release + export web + bundle check
        run: npm run qa:web:release
        env:
          # Opcional: mismo valor que RUM_ANON_INGEST_KEY en Supabase (repo → Settings → Secrets).
          # Si falta, el export en CI sigue OK; solo no se enviará RUM desde ese build.
          EXPO_PUBLIC_RUM_ANON_KEY: ${{ secrets.EXPO_PUBLIC_RUM_ANON_KEY }}

      - name: Lighthouse CI (umbrales; falla el job si no cumple)
        run: npm run perf:lhci
        env:
          LHCI_TARGET_URL: ${{ secrets.LHCI_TARGET_URL }}

      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci
          path: .lighthouseci
          if-no-files-found: ignore

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # `qa:web:release` ya dejó `dist/` listo → globalSetup no vuelve a exportar (ahorra minutos en CI).
      - name: E2E web (Playwright)
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_SKIP_EXPORT: '1'
          # Cliente + (opc.) admin org legacy — igual que antes.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          # Si las cargás en GitHub Secrets, el journey también cubre staff org + plataforma (como en local con Maestro).
          E2E_ORG_ADMIN_EMAIL: ${{ secrets.E2E_ORG_ADMIN_EMAIL }}
          E2E_ORG_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_ADMIN_PASSWORD }}
          E2E_PLATFORM_ADMIN_EMAIL: ${{ secrets.E2E_PLATFORM_ADMIN_EMAIL }}
          E2E_PLATFORM_ADMIN_PASSWORD: ${{ secrets.E2E_PLATFORM_ADMIN_PASSWORD }}
          # Exige cliente + staff org + plataforma en `full-web-journey` (falla al inicio si falta algún E2E_*).
          E2E_JOURNEY_STRICT: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
